<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-white font-sans antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bağlantı Yok - Meydan</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-6 text-center">
    <div class="max-w-md w-full p-8 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl space-y-5">
        <div class="w-16 h-16 mx-auto rounded-full bg-blue-600/20 text-blue-500 flex items-center justify-center text-3xl">
            📡
        </div>

        <div>
            <h1 class="text-xl font-black text-white tracking-tight">İnternet Bağlantısı Kesildi</h1>
            <p class="text-xs text-slate-400 mt-2 leading-relaxed">
                Şu anda çevrimdışısınız. Bağlantınız yeniden kurulduğunda mahalle ve genel akışınız otomatik olarak güncellenecektir.
            </p>
        </div>

        <button onclick="window.location.reload()"
                class="w-full py-3 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow-lg transition-all">
            Tekrar Dene
        </button>
    </div>
</body>
</html>
